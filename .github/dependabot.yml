version: 2
updates:
  # Minor and patch updates arrive grouped in one weekly PR; major updates
  # and security fixes get their own PRs so they can be reviewed separately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
